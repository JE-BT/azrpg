<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* azrpg Alpha 7 · RPG Maker 2000/XP windows: a blue gradient panel, a light rim, a pale cursor bar */
:root {
  --bg: #070914; --win-a: #33498f; --win-b: #121a45; --rim: #e6ebff; --rim2: #0b1030; --ink: #f4f6ff; --dim: #aab3da;
  --gold: #f5c542; --teal: #4fd1c5; --late: #ff8a7a; --early: #9be59b; --cursor: rgba(214, 226, 255, 0.16);
  --font: "DotGothic16", "MS Gothic", "Osaka-Mono", "Courier New", monospace;
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #070914; } }
:root[data-theme="dark"] { --bg: #070914; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; }
.win { background: linear-gradient(180deg, var(--win-a), var(--win-b)); border: 2px solid var(--rim); border-radius: 6px; box-shadow: inset 0 0 0 2px var(--rim2), 0 6px 18px rgba(0, 0, 0, .5); color: var(--ink); }
.hook { color: var(--gold); } .side { color: var(--teal); } .dim { color: var(--dim); } .late { color: var(--late); } .early { color: var(--early); }
.tag { font-size: 10px; padding: 0 3px; border-radius: 3px; vertical-align: 1px; opacity: .8; white-space: nowrap; }
.t-data { background: #2d5b8a; } .t-mixed { background: #8a6a1f; } .t-new { background: #8a2d6a; }
h3 { margin: .2em 0 .35em; font-size: 17px; font-weight: normal; color: var(--gold); }
h4 { margin: .8em 0 .25em; font-size: 14px; font-weight: normal; color: var(--dim); }
p { margin: .3em 0 .55em; }
ul { margin: .2em 0 .6em; padding-left: 1.2em; }
#status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; color: var(--dim); z-index: 90; }

/* ------------------------------------------------------------- HUD */
#hud-obj { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); max-width: min(460px, 48vw); padding: 7px 12px; z-index: 10; font-size: 14px; }
#hud-obj:empty { display: none; }
#hud-mini { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); padding: 4px; z-index: 10; cursor: pointer; line-height: 0; }
#mini { width: 168px; height: 112px; image-rendering: pixelated; border-radius: 3px; }
#hud-trip { position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px)); padding: 6px 14px; z-index: 10; font-size: 14px; max-width: min(560px, 40vw); text-align: center; }
#hud-trip:empty { display: none; }
#hud-clock { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 7px 12px; z-index: 10; font-size: 13px; min-width: 250px; }
#hud-clock .big { font-size: 18px; color: var(--gold); }
#hud-keys { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 4px 12px; z-index: 9; font-size: 12px; color: var(--dim); white-space: nowrap; }
#hud-keys b { color: var(--ink); font-weight: normal; }
#vpanel { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 6px; z-index: 11; transform: translateX(calc(100% + 16px)); transition: transform .35s ease; }
#vpanel.on { transform: none; }
#vp-cv { width: 420px; height: 236px; display: block; image-rendering: pixelated; border-radius: 3px; }
#vp-label { font-size: 12px; color: var(--dim); padding: 3px 2px 0; }
#vtab { position: fixed; right: 0; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); z-index: 11; padding: 8px 6px; border-radius: 6px 0 0 6px; border-right: none; font-size: 12px; writing-mode: vertical-rl; }
body.titling #hud-obj, body.titling #hud-mini, body.titling #hud-trip, body.titling #hud-clock, body.titling #hud-keys, body.titling #vpanel, body.titling #vtab, body.titling #touch { display: none; }
#banner { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); text-align: center; z-index: 20; pointer-events: none; opacity: 0; text-shadow: 0 2px 0 #000, 0 0 8px #000; }
#banner.on { animation: bannerIn 3.2s ease forwards; }
#banner .t { font-size: 22px; } #banner .s { font-size: 13px; color: var(--dim); }
@keyframes bannerIn { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(118px + env(safe-area-inset-top, 0px)); width: min(560px, calc(100vw - 20px)); z-index: 21; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { padding: 6px 12px; font-size: 13px; transition: opacity 1s; }
.toast.fade { opacity: 0; } .toast.teal { border-color: var(--teal); } .toast.gold { border-color: var(--gold); }

/* ------------------------------------------------------------- windows: message box and command window */
#msg { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(780px, calc(100vw - 20px)); max-height: 46vh; overflow: auto; padding: 14px 18px 22px; z-index: 55; display: none; font-size: 15px; cursor: pointer; }
#msg.on { display: block; }
#msg .more { position: absolute; right: 12px; bottom: 4px; color: var(--gold); animation: blink 1s steps(2) infinite; }
.who { display: inline-block; margin: -4px 0 8px; padding: 1px 10px; border: 1px solid var(--rim); border-radius: 4px; background: rgba(7, 9, 20, .55); color: var(--gold); font-size: 13px; }
#menuwin { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100vw - 20px)); max-height: min(84vh, 760px); display: none; flex-direction: column; padding: 12px 14px; z-index: 50; }
#menuwin.on { display: flex; } #menuwin.wide { width: min(860px, calc(100vw - 20px)); }
#menuwin .mt { font-size: 20px; color: var(--gold); } #menuwin .ms { font-size: 13px; color: var(--dim); margin-bottom: 4px; }
#menuwin .mp { margin: 4px 0 8px; max-height: 32vh; overflow: auto; }
#menuwin .ml { list-style: none; margin: 0; padding: 4px 0; overflow: auto; flex: 1 1 auto; min-height: 2em; border-top: 1px solid rgba(230, 235, 255, .25); }
#menuwin li { position: relative; padding: 4px 10px 4px 24px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
#menuwin li.sel { background: var(--cursor); border-color: rgba(230, 235, 255, .45); animation: pulse 1.6s ease-in-out infinite; }
#menuwin li.sel::before { content: "▶"; position: absolute; left: 6px; color: var(--gold); font-size: 12px; top: 6px; }
#menuwin li.dis { opacity: .42; cursor: default; }
#menuwin .ml.cols li { display: flex; gap: 10px; align-items: baseline; }
#menuwin .ml.cols .lab { flex: 0 1 auto; }
#menuwin .ml.cols .lead { flex: 1 1 auto; min-width: 12px; align-self: stretch; background: radial-gradient(circle, rgba(170, 179, 218, .55) 1px, transparent 1.3px) left 68% / 6px 6px repeat-x; }
#menuwin .ml.cols .det { flex: 0 1 auto; text-align: right; color: var(--dim); font-size: 13px; }
#menuwin .ml.cols .det:empty { display: none; }
#menuwin .mh { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(230, 235, 255, .25); font-size: 13px; color: var(--dim); min-height: 1.4em; }
#menuwin .mh:empty { display: none; }
.logo { font-size: 30px; letter-spacing: .02em; }
@keyframes pulse { 50% { background: rgba(214, 226, 255, .26); } }
@keyframes blink { 50% { opacity: 0; } }
table.keys td { padding: 2px 10px 2px 0; vertical-align: top; } table.keys td:first-child { color: var(--gold); white-space: nowrap; }
table.survey { border-collapse: collapse; width: 100%; font-size: 13px; } table.survey th { text-align: left; color: var(--dim); font-weight: normal; padding: 1px 10px 1px 0; white-space: nowrap; vertical-align: top; } table.survey td { padding: 1px 0; }

/* ------------------------------------------------------------- the menu: tabs, body, help */
#menu { position: fixed; inset: 0; z-index: 30; display: none; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(5, 7, 18, .55); }
#menu.on { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; max-width: 1180px; margin: 0 auto; }
#mtabs { display: flex; gap: 8px; }
#mtabs button { flex: 1; padding: 6px 4px; border: 2px solid var(--rim); border-radius: 6px; background: linear-gradient(180deg, var(--win-a), var(--win-b)); box-shadow: inset 0 0 0 2px var(--rim2); font-size: 15px; }
#mtabs button small { margin-left: 6px; color: var(--dim); font-size: 11px; }
#mtabs button.on { color: var(--gold); border-color: var(--gold); }
#mtabs .mx { flex: 0 0 46px; }
.mbody { overflow: auto; padding: 12px 16px; min-height: 0; }
#mhelp { padding: 6px 14px; font-size: 13px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.mbody.t-journal, .mbody.t-atlas { display: grid; grid-template-columns: minmax(220px, 34%) 1fr; gap: 16px; overflow: hidden; }
.jlist { list-style: none; margin: 0; padding: 0 8px 0 0; overflow: auto; border-right: 1px solid rgba(230, 235, 255, .2); }
.jlist li { padding: 3px 8px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
.jlist li.jh { color: var(--dim); cursor: default; margin-top: 10px; font-size: 13px; border-bottom: 1px solid rgba(230, 235, 255, .2); border-radius: 0; }
.jlist li.sel { background: var(--cursor); border-color: rgba(230, 235, 255, .45); }
.jdetail { overflow: auto; padding-right: 6px; }
.alist li { display: grid; grid-template-columns: 1fr 70px auto; gap: 8px; align-items: center; }
.bar { height: 6px; background: rgba(7, 9, 20, .6); border: 1px solid rgba(230, 235, 255, .3); border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--gold); }
ul.cards { list-style: none; padding: 0; } ul.cards li { padding: 4px 0; border-bottom: 1px solid rgba(230, 235, 255, .12); }
.sw { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid var(--rim); vertical-align: -1px; }
.atlas canvas { max-width: 100%; border: 1px solid rgba(230, 235, 255, .3); border-radius: 4px; background: rgba(7, 9, 20, .5); image-rendering: pixelated; }
.mbody.t-map { display: grid; grid-template-rows: 1fr auto; padding: 8px; overflow: hidden; }
.mapbox { min-height: 0; } #wmap { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; border-radius: 4px; }
.mapinfo { padding: 6px 4px 0; font-size: 13px; }

/* ------------------------------------------------------------- the journey scene: the viewing window fills the screen */
#scene { position: fixed; inset: 0; z-index: 40; display: none; background: radial-gradient(ellipse at 50% 30%, #141c46 0%, #070914 70%); flex-direction: column; align-items: center; padding-top: calc(4vh + env(safe-area-inset-top, 0px)); }
#scene.on { display: flex; animation: sceneIn .5s steps(6) both; }
#scene-frame { padding: 6px; }
#scene-cv { display: block; width: min(94vw, calc(52vh * 210 / 118)); aspect-ratio: 210 / 118; image-rendering: pixelated; border-radius: 3px; }
#scene-label { margin-top: 8px; font-size: 14px; color: var(--dim); letter-spacing: .03em; }
body.in-scene #menuwin { top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-height: 36vh; }
body.in-scene #msg { max-height: 34vh; }
@keyframes sceneIn { from { clip-path: inset(0 50% 0 50%); } to { clip-path: inset(0 0 0 0); } }

/* ------------------------------------------------------------- touch and small screens */
#touch { display: none; }
@media (pointer: coarse) {
  #touch { display: block; } #hud-keys { display: none; }
  #pad { position: fixed; right: 14px; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); width: 150px; height: 150px; z-index: 12; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 4px; }
  #pad button, #acts button { border: 2px solid var(--rim); border-radius: 8px; background: rgba(18, 26, 69, .8); font-size: 18px; touch-action: none; }
  #pad [data-pad="up"] { grid-area: 1 / 2; } #pad [data-pad="left"] { grid-area: 2 / 1; } #pad [data-pad="right"] { grid-area: 2 / 3; } #pad [data-pad="down"] { grid-area: 3 / 2; }
  #acts { position: fixed; right: 14px; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 12; display: flex; gap: 6px; }
  #acts button { padding: 8px 12px; font-size: 14px; }
  #vp-cv { width: 280px; height: 157px; } #hud-clock { min-width: 0; font-size: 12px; }
}
@media (max-width: 760px) {
  #mini { width: 112px; height: 75px; } #hud-trip { top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 90vw; }
  .cols2 { grid-template-columns: 1fr; } .mbody.t-journal, .mbody.t-atlas { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; } .jlist { border-right: none; border-bottom: 1px solid rgba(230, 235, 255, .2); }
  #mtabs button small { display: none; } #vp-cv { width: 280px; height: 157px; }
}
@media (prefers-reduced-motion: reduce) { #scene.on, #banner.on, #menuwin li.sel, #msg .more { animation: none; } #banner.on { opacity: 1; } #vpanel { transition: none; } }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body class="titling">
<canvas id="view"></canvas>
<div id="status">Unfolding the map…</div>
<div id="hud-obj" class="win"></div>
<div id="hud-mini" class="win" title="Map (M)"><canvas id="mini" width="168" height="112"></canvas></div>
<div id="hud-trip" class="win"></div>
<div id="hud-clock" class="win"></div>
<div id="hud-keys" class="win"><b>Space</b> act · <b>F</b> journey · <b>R</b> rest · <b>L</b> look · <b>V</b> view · <b>Esc</b> menu · <b>H</b> help</div>
<div id="vpanel" class="win"><canvas id="vp-cv" width="210" height="118"></canvas><div id="vp-label"></div></div>
<button id="vtab" class="win" type="button" data-cmd="view" aria-label="Show or hide the viewing window">View</button>
<div id="banner"></div>
<div id="toasts"></div>
<div id="menu"><nav id="mtabs"></nav><div id="mbody" class="win mbody"></div><div id="mhelp" class="win"></div></div>
<div id="scene"><div id="scene-frame" class="win"><canvas id="scene-cv" width="210" height="118"></canvas></div><div id="scene-label"></div></div>
<div id="menuwin" class="win" role="dialog" aria-live="polite"></div>
<div id="msg" class="win" role="dialog" aria-live="polite"></div>
<div id="touch"><div id="pad"><button data-pad="up" aria-label="North">▲</button><button data-pad="left" aria-label="West">◀</button><button data-pad="right" aria-label="East">▶</button><button data-pad="down" aria-label="South">▼</button></div>
<div id="acts"><button data-cmd="act">A</button><button data-cmd="menu">Menu</button><button data-cmd="trip">F</button></div></div>
<script id="pack" type="application/octet-stream">__PACK__</script>
<script>
__ENGINE__
AZ.CONTENT = __CONTENT__;
AZ.boot(document.getElementById("pack").textContent);
</script>
</body>
</html>
